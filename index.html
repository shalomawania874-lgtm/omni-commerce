<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080c"><title>OmniCommerce</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app"><div class="wrap"><div class="card"><div class="brand">OMNI<span>COMMERCE</span></div><h2>Loading commerce OS…</h2><p class="muted">Starting the live workspace.</p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js"></script><script>window.addEventListener("error",e=>{const a=document.getElementById("app");if(a)a.innerHTML='<div class="wrap"><div class="card"><h2>Startup error</h2><p class="muted">'+String(e.message||"Unknown error").replace(/[<>&]/g,"")+'</p><button class="primary" onclick="location.reload()">Reload</button></div></div>'});window.addEventListener("unhandledrejection",()=>{const a=document.getElementById("app");if(a)a.innerHTML='<div class="wrap"><div class="card"><h2>Backend connection failed</h2><p class="muted">Retrying the live connection did not succeed.</p><button class="primary" onclick="location.reload()">Retry</button></div></div>'});</script></body></html>
